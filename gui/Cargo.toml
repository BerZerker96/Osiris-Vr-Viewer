[package]
name = "osiris-gui"
version = "0.5.0-dev1"
edition = "2021"
description = "Osiris VR Viewer — control panel."
license = "MIT"

[[bin]]
name = "osiris-gui"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.27"
egui_extras = { version = "0.27", features = ["image"] }
image = { version = "0.24", default-features = false, features = ["ico", "png", "jpeg"] }
osiris-shared = { path = "../osiris-shared" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
rfd = "0.14"
global-hotkey = "0.5"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.48", features = [
    "Win32_System_Memory",
    "Win32_Security",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
] }

[build-dependencies]
winres = "0.1"
